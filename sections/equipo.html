<section id="equipo">
  <div class="container">
    <h2 id="team-heading"></h2>

    <div class="profile-cards-container">
      <!-- Isabel (left) -->
      <div class="profile-card profile-card--left reveal">
        <div class="profile-card__image">
          <span id="isabel-initial" aria-hidden="true"></span>
        </div>
        <div class="profile-card__content">
          <h3 class="profile-card__name" id="isabel-name"></h3>
          <p class="profile-card__role label" id="isabel-role"></p>
          <p class="profile-card__bio reveal" id="isabel-bio"></p>
          <blockquote class="profile-card__quote text-quote" id="isabel-quote"></blockquote>
        </div>
      </div>

      <!-- Alicia (right) -->
      <div class="profile-card profile-card--right reveal">
        <div class="profile-card__image">
          <span id="alicia-initial" aria-hidden="true"></span>
        </div>
        <div class="profile-card__content">
          <h3 class="profile-card__name" id="alicia-name"></h3>
          <p class="profile-card__role label" id="alicia-role"></p>
          <p class="profile-card__bio reveal" id="alicia-bio"></p>
          <blockquote class="profile-card__quote text-quote" id="alicia-quote"></blockquote>
        </div>
      </div>

      <!-- Leticia (left) -->
      <div class="profile-card profile-card--left reveal">
        <div class="profile-card__image">
          <span id="leticia-initial" aria-hidden="true"></span>
        </div>
        <div class="profile-card__content">
          <h3 class="profile-card__name" id="leticia-name"></h3>
          <p class="profile-card__role label" id="leticia-role"></p>
          <p class="profile-card__bio reveal" id="leticia-bio"></p>
          <blockquote class="profile-card__quote text-quote" id="leticia-quote"></blockquote>
        </div>
      </div>
    </div>

    <!-- Quote Band -->
    <div class="quote-band">
      <div class="quote-band__inner">
        <span class="quote-band__mark" aria-hidden="true">"</span>
        <blockquote class="text-quote" id="quote-band-text"></blockquote>
      </div>
    </div>
  </div>
</section>
